<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tidewire — Free as the tide. Wired together.</title>
<meta name="description" content="Tidewire: an open-source SIP server built on Kamailio. Free as the tide. Wired together.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 140 140'%3E%3Crect width='140' height='140' rx='32' fill='%230B1F33'/%3E%3Cg transform='translate(18 18) scale(0.866667)' fill='none' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 74 Q 24 46 40 64 T 70 64' stroke='%23F2F7F8'/%3E%3Cpath d='M70 64 L80 38 L90 88 L99 50 L106 70 L113 62' stroke='%2322C3B4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Sora:wght@500;600&display=swap">
<style>
  :root {
    --bg: #EEF3F4;
    --ink: #0B1F33;
    --accent: #22C3B4;
    --muted: #4A5B6C;
    --link: #0E7C74;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B1F33;
      --ink: #F2F7F8;
      --accent: #22C3B4;
      --muted: #9FB3C4;
      --link: #9FB3C4;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 24px 16px 80px;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(16px, 3vw, 24px);
    text-align: center;
  }
  .lockup {
    display: flex;
    align-items: center;
    gap: clamp(12px, 2.5vw, 22px);
  }
  .logo {
    width: clamp(64px, 14vw, 112px);
    height: auto;
    flex: none;
  }
  .logo .tide  { stroke: var(--ink); }
  .logo .wire  { stroke: var(--accent); }
  .logo .swell { stroke: var(--accent); stroke-opacity: 0.45; }
  h1 {
    margin: 0;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(44px, 11vw, 80px);
    letter-spacing: -0.03em;
    line-height: 1;
  }
  h1 span { color: var(--accent); }
  .slogan {
    margin: 0;
    font-family: "Sora", system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(12px, 2.6vw, 17px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }
  footer {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
  }
  footer a {
    display: inline-block;
    padding: 10px 14px;
    font-family: "Sora", system-ui, sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--link);
    text-decoration: none;
  }
  footer a:hover,
  footer a:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
</style>
</head>
<body>
  <main>
    <div class="lockup">
      <svg class="logo" viewBox="0 0 120 120" fill="none" aria-hidden="true">
        <path class="tide"  d="M8 74 Q 24 46 40 64 T 70 64" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="wire"  d="M70 64 L80 38 L90 88 L99 50 L106 70 L113 62" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="swell" d="M14 96 Q 30 82 46 92 T 78 92 T 108 92" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <h1>tide<span>wire</span></h1>
    </div>
    <p class="slogan">Free as the tide. Wired together.</p>
  </main>
  <footer>
    <a href="https://github.com/tidewire">GitHub</a>
  </footer>
</body>
</html>
